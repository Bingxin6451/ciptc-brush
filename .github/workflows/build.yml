name: build-windows-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build single-file exe
        run: |
          pyinstaller --onefile --clean --console --name ciptc_brush `
            --exclude-module ddddocr --exclude-module onnxruntime `
            --exclude-module onnx --exclude-module numpy --exclude-module PIL `
            ciptc_brush.py

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/ciptc_brush.exe"
          tag: ${{ github.ref_name }}
          allowUpdates: true
          name: "ciptc_brush ${{ github.ref_name }}"
          token: ${{ secrets.GITHUB_TOKEN }}
