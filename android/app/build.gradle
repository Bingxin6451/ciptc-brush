apply plugin: 'com.android.application'

android {
    namespace 'cn.ciptc.brush'
    compileSdk 34

    defaultConfig {
        applicationId "cn.ciptc.brush"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
